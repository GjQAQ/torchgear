[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "torchgear"
version = "0.1.0"
description = "Utility extensions for PyTorch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
]

[dependency-groups]
build = [
    "build",
]
doc = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]
test = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
