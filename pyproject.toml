[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "torchgear"
version = "0.2.0"
description = "Utility extensions for PyTorch"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jiaqi Guo" },
]
keywords = ["pytorch", "utilities", "tensor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/GjQAQ/torchgear"
Repository = "https://github.com/GjQAQ/torchgear"
Issues = "https://github.com/GjQAQ/torchgear/issues"
Documentation = "https://gjqaq.github.io/torchgear/"

[dependency-groups]
build = [
    "build",
]
doc = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]
test = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
